<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Smart Tech – Product Manager</title>
    <link rel="icon" type="image/x-icon" href="logo.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f0; }
        .serif-title { font-family: 'Playfair Display', serif; }
        .image-thumb { width: 80px; height: 80px; object-fit: contain; border: 1px solid #e5e7eb; padding: 4px; background: white; }
        .gift-badge { background: #d4af37; color: black; font-size: 9px; padding: 2px 6px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="min-h-screen bg-stone-50">
        <nav class="bg-neutral-950 text-white sticky top-0 z-50 border-b border-neutral-800">
            <div class="container mx-auto px-4 md:px-8 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="logo.jpg" alt="Logo" class="h-8 w-auto" />
                    <span class="text-sm font-medium tracking-[0.2em] text-stone-200">PRODUCT MANAGER</span>
                </div>
                <a href="index.html" class="text-[10px] font-medium tracking-[0.2em] uppercase text-stone-400 hover:text-white border border-stone-700 px-4 py-2 transition">
                    <i class="fa-solid fa-store mr-2"></i> View Store
                </a>
            </div>
        </nav>

        <div class="container mx-auto px-4 md:px-8 py-8">

            <!-- Add/Edit Form -->
            <div class="bg-white border border-stone-200 p-6 md:p-8 mb-10 shadow-sm">
                <h3 id="form-title" class="serif-title text-xl font-light text-neutral-800 mb-6">Add New Product</h3>
                <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="hidden" id="edit-id" value="" />

                    <div class="space-y-1">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Product Name *</label>
                        <input type="text" id="p-name" required class="w-full border border-stone-200 px-4 py-2.5 text-sm focus:border-neutral-800 focus:outline-none transition" />
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Discounted Price (Rs) <span class="text-stone-400">(0 = Inquire)</span></label>
                        <input type="number" id="p-price" value="0" min="0" step="0.01" class="w-full border border-stone-200 px-4 py-2.5 text-sm focus:border-neutral-800 focus:outline-none transition" />
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Old Price (Rs) <span class="text-stone-400">(original price, optional)</span></label>
                        <input type="number" id="p-oldprice" value="0" min="0" step="0.01" class="w-full border border-stone-200 px-4 py-2.5 text-sm focus:border-neutral-800 focus:outline-none transition" />
                    </div>

                    <div class="space-y-1 md:col-span-2">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Description</label>
                        <textarea id="p-desc" rows="2" class="w-full border border-stone-200 px-4 py-2.5 text-sm focus:border-neutral-800 focus:outline-none transition"></textarea>
                    </div>

                    <!-- NEW: Gifts with purchase -->
                    <div class="space-y-1 md:col-span-2">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Gifts with Purchase <span class="text-stone-400">(e.g., "Free keychain, USB cable")</span></label>
                        <textarea id="p-giftinfo" rows="2" class="w-full border border-stone-200 px-4 py-2.5 text-sm focus:border-neutral-800 focus:outline-none transition"></textarea>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Category *</label>
                        <select id="p-category" required class="w-full border border-stone-200 px-4 py-2.5 text-sm focus:border-neutral-800 focus:outline-none transition bg-white">
                            <option value="car-parts">Car Parts</option>
                            <option value="others">Others</option>
                            <option value="promotion">Promotion</option>
                            <!-- gift category removed – we use gift_info instead -->
                        </select>
                    </div>

                    <div class="space-y-1 flex items-center gap-4 pt-4">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500 flex items-center gap-2">
                            <input type="checkbox" id="p-stock" checked class="w-4 h-4 accent-neutral-900" />
                            In Stock
                        </label>
                    </div>

                    <!-- =========== MULTIPLE IMAGES =========== -->
                    <div class="space-y-1 md:col-span-2">
                        <label class="text-[10px] font-medium uppercase tracking-wider text-stone-500">Product Images</label>
                        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                            <input type="file" id="p-images" accept="image/*" multiple class="text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-xs file:font-medium file:bg-stone-100 file:text-neutral-800 hover:file:bg-stone-200 transition" />
                            <span class="text-xs text-stone-400 italic">Select multiple images (hold Ctrl/Cmd)</span>
                        </div>

                        <!-- Existing images list -->
                        <div id="image-list" class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <!-- Rendered by JavaScript -->
                        </div>

                        <!-- Preview for newly selected images -->
                        <div id="new-image-previews" class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <!-- Rendered by JavaScript -->
                        </div>
                    </div>

                    <div class="md:col-span-2 flex items-center gap-4 pt-2 border-t border-stone-100">
                        <button type="submit" class="bg-neutral-950 hover:bg-[#d4af37] text-white hover:text-black text-xs font-medium tracking-[0.2em] uppercase px-8 py-3 transition duration-300">
                            <i class="fa-solid fa-save mr-2"></i> Save Product
                        </button>
                        <button type="button" onclick="resetForm()" class="text-[10px] font-medium text-stone-400 hover:text-stone-600 underline transition">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Product List -->
            <div>
                <h3 class="serif-title text-xl font-light text-neutral-800 mb-4">Manage Inventory</h3>
                <div class="bg-white border border-stone-200 overflow-x-auto shadow-sm">
                    <table class="w-full text-sm">
                        <thead class="bg-stone-50 border-b border-stone-200">
                            <tr class="text-left text-[10px] font-medium uppercase tracking-wider text-stone-500">
                                <th class="px-4 py-3">Image</th>
                                <th class="px-4 py-3">Name</th>
                                <th class="px-4 py-3">Category</th>
                                <th class="px-4 py-3">Price</th>
                                <th class="px-4 py-3">Old Price</th>
                                <th class="px-4 py-3">Gift Info</th>
                                <th class="px-4 py-3">Stock</th>
                                <th class="px-4 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="divide-y divide-stone-100"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- ====================== SCRIPT ====================== -->
    <script>
        // Supabase config
        const SUPABASE_URL = 'https://zjfqatxxksjwxfptxouq.supabase.co';
        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZnFhdHh4a3Nqd3hmcHR4b3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDY4OTAsImV4cCI6MjA5NjQ4Mjg5MH0.RNuMP2XDBi1N3fz2NiEKgtf-ngC-52OHAiBH9B8umpU';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM refs
        const tableBody = document.getElementById('product-table-body');
        const productForm = document.getElementById('product-form');
        const formTitle = document.getElementById('form-title');
        const editId = document.getElementById('edit-id');
        const pName = document.getElementById('p-name');
        const pDesc = document.getElementById('p-desc');
        const pPrice = document.getElementById('p-price');
        const pOldPrice = document.getElementById('p-oldprice');
        const pGiftInfo = document.getElementById('p-giftinfo');
        const pCategory = document.getElementById('p-category');
        const pStock = document.getElementById('p-stock');
        const pImages = document.getElementById('p-images');
        const imageList = document.getElementById('image-list');
        const newImagePreviews = document.getElementById('new-image-previews');

        let existingImages = [];
        let newImageFiles = [];

        // Load products
        async function loadProducts() {
            const { data: products, error } = await supabaseClient
                .from('smarttech')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert('Error loading products: ' + error.message);
                return;
            }

            if (!products || products.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-stone-400 py-8 text-sm">No products found. Add your first product above!</td></tr>`;
                return;
            }

            let html = '';
            for (const p of products) {
                const { data: imgs } = await supabaseClient
                    .from('product_images')
                    .select('image_url')
                    .eq('product_id', p.id)
                    .order('display_order', { ascending: true })
                    .limit(1);

                const mainImage = imgs && imgs.length > 0 ? imgs[0].image_url : p.image_url || 'placeholder.jpg';
                const priceDisplay = (p.price === 0 || p.price === null) ? 'Inquire' : `Rs ${p.price.toLocaleString()}`;
                const oldPriceDisplay = (p.old_price && p.old_price > 0) ? `Rs ${p.old_price.toLocaleString()}` : '-';
                const giftInfoDisplay = p.gift_info || '-';
                const stockIcon = p.in_stock ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-red-500';
                const stockText = p.in_stock ? 'In Stock' : 'Out of Stock';
                html += `
                    <tr class="hover:bg-stone-50 transition">
                        <td class="px-4 py-3"><img src="${mainImage}" alt="${p.name}" class="h-10 w-10 object-contain" /></td>
                        <td class="px-4 py-3 font-medium text-neutral-800">${p.name}</td>
                        <td class="px-4 py-3 text-stone-500 text-xs uppercase">${p.category.replace('-', ' ')}</td>
                        <td class="px-4 py-3 text-sm">${priceDisplay}</td>
                        <td class="px-4 py-3 text-sm">${oldPriceDisplay}</td>
                        <td class="px-4 py-3 text-xs text-stone-600 max-w-[120px] truncate">${giftInfoDisplay}</td>
                        <td class="px-4 py-3 text-xs"><i class="fa-solid ${stockIcon} mr-1"></i> ${stockText}</td>
                        <td class="px-4 py-3 text-right space-x-2">
                            <button onclick="editProduct('${p.id}')" class="text-xs text-stone-600 hover:text-neutral-900 transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="text-xs text-red-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            }
            tableBody.innerHTML = html;
        }

        // Load images for a product
        async function loadImages(productId) {
            const { data, error } = await supabaseClient
                .from('product_images')
                .select('*')
                .eq('product_id', productId)
                .order('display_order', { ascending: true });

            if (error) {
                alert('Error loading images: ' + error.message);
                return [];
            }
            return data || [];
        }

        // Render existing images
        function renderImageList(images) {
            if (!images || images.length === 0) {
                imageList.innerHTML = `<p class="text-stone-400 text-xs col-span-full">No images uploaded yet.</p>`;
                return;
            }
            let html = '';
            images.forEach(img => {
                const giftLabel = img.is_gift ? '<span class="gift-badge ml-1">GIFT</span>' : '';
                html += `
                    <div class="relative border border-stone-200 p-2 bg-white rounded flex flex-col items-center" data-id="${img.id}">
                        <img src="${img.image_url}" class="image-thumb" />
                        <div class="flex items-center gap-2 mt-1 text-[10px]">
                            <label class="flex items-center gap-1">
                                <input type="checkbox" class="image-gift-toggle" data-id="${img.id}" ${img.is_gift ? 'checked' : ''} />
                                Gift
                            </label>
                            <button type="button" class="text-red-400 hover:text-red-600" onclick="removeImage('${img.id}')">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            imageList.innerHTML = html;

            // Attach gift toggle events
            document.querySelectorAll('.image-gift-toggle').forEach(cb => {
                cb.addEventListener('change', async function() {
                    const id = this.dataset.id;
                    const isGift = this.checked;
                    const { error } = await supabaseClient
                        .from('product_images')
                        .update({ is_gift: isGift })
                        .eq('id', id);
                    if (error) alert('Error updating gift status: ' + error.message);
                });
            });
        }

        // Remove an existing image
        async function removeImage(id) {
            if (!confirm('Remove this image?')) return;
            const { error } = await supabaseClient
                .from('product_images')
                .delete()
                .eq('id', id);
            if (error) {
                alert('Error deleting image: ' + error.message);
                return;
            }
            existingImages = existingImages.filter(img => img.id !== id);
            renderImageList(existingImages);
        }

        // Handle new image selection
        pImages.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Store files
            newImageFiles = files.map((file, idx) => ({
                file,
                previewUrl: URL.createObjectURL(file),
                is_gift: false
            }));

            // Show previews
            let html = '';
            newImageFiles.forEach((item, index) => {
                html += `
                    <div class="relative border border-stone-200 p-2 bg-white rounded flex flex-col items-center" data-index="${index}">
                        <img src="${item.previewUrl}" class="image-thumb" />
                        <div class="flex items-center gap-2 mt-1 text-[10px]">
                            <label class="flex items-center gap-1">
                                <input type="checkbox" class="new-image-gift" data-index="${index}" />
                                Gift
                            </label>
                            <button type="button" class="text-red-400 hover:text-red-600" onclick="removeNewImage(${index})">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            newImagePreviews.innerHTML = html;
        });

        // Remove a new image from preview
        function removeNewImage(index) {
            newImageFiles.splice(index, 1);
            // Rebuild preview
            const files = newImageFiles.map(item => item.file);
            pImages.value = '';
            const dt = new DataTransfer();
            files.forEach(f => dt.items.add(f));
            pImages.files = dt.files;
            pImages.dispatchEvent(new Event('change'));
        }

        // Save product
        async function saveProduct(event) {
            event.preventDefault();
            const id = editId.value;
            const name = pName.value.trim();
            const description = pDesc.value.trim();
            const price = parseFloat(pPrice.value) || 0;
            const oldPrice = parseFloat(pOldPrice.value) || 0;
            const giftInfo = pGiftInfo.value.trim();
            const category = pCategory.value;
            const inStock = pStock.checked;

            if (!name) { alert('Product name is required.'); return; }

            const productData = {
                name,
                description,
                price,
                old_price: oldPrice,
                gift_info: giftInfo || null,
                category,
                in_stock: inStock
                // image_url will be set later
            };

            let productId = id;
            let result;

            if (id) {
                result = await supabaseClient.from('smarttech').update(productData).eq('id', id);
                if (result.error) {
                    alert('Error updating product: ' + result.error.message);
                    return;
                }
                productId = id;
            } else {
                result = await supabaseClient.from('smarttech').insert([productData]);
                if (result.error) {
                    alert('Error adding product: ' + result.error.message);
                    return;
                }
                // Get new product ID
                const { data: newProduct, error: fetchError } = await supabaseClient
                    .from('smarttech')
                    .select('id')
                    .eq('name', name)
                    .order('created_at', { ascending: false })
                    .limit(1);
                if (fetchError) {
                    alert('Error fetching new product: ' + fetchError.message);
                    return;
                }
                productId = newProduct[0].id;
            }

            // Upload new images
            const uploadedUrls = [];
            for (const item of newImageFiles) {
                const file = item.file;
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;
                const filePath = `product-images/${fileName}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('product-images')
                    .upload(filePath, file, { cacheControl: '3600', upsert: false });

                if (uploadError) {
                    alert('Error uploading image: ' + uploadError.message);
                    return;
                }

                const { data: urlData } = supabaseClient.storage
                    .from('product-images')
                    .getPublicUrl(filePath);
                const imageUrl = urlData.publicUrl;

                // Insert into product_images
                const { error: insertError } = await supabaseClient
                    .from('product_images')
                    .insert([{
                        product_id: productId,
                        image_url: imageUrl,
                        is_gift: item.is_gift,
                        display_order: existingImages.length + uploadedUrls.length
                    }]);

                if (insertError) {
                    alert('Error saving image record: ' + insertError.message);
                    return;
                }
                uploadedUrls.push(imageUrl);
            }

            // Set main image_url
            const { data: allImages } = await supabaseClient
                .from('product_images')
                .select('image_url')
                .eq('product_id', productId)
                .order('display_order', { ascending: true })
                .limit(1);

            let mainImageUrl = null;
            if (allImages && allImages.length > 0) {
                mainImageUrl = allImages[0].image_url;
            } else if (uploadedUrls.length > 0) {
                mainImageUrl = uploadedUrls[0];
            }

            if (mainImageUrl) {
                await supabaseClient
                    .from('smarttech')
                    .update({ image_url: mainImageUrl })
                    .eq('id', productId);
            }

            alert('Product saved successfully!');
            resetForm();
            loadProducts();
        }

        // Edit product
        async function editProduct(id) {
            const { data: product, error } = await supabaseClient
                .from('smarttech')
                .select('*')
                .eq('id', id)
                .single();

            if (error) {
                alert('Error loading product: ' + error.message);
                return;
            }

            editId.value = product.id;
            pName.value = product.name;
            pDesc.value = product.description || '';
            pPrice.value = product.price || 0;
            pOldPrice.value = product.old_price || 0;
            pGiftInfo.value = product.gift_info || '';
            pCategory.value = product.category;
            pStock.checked = product.in_stock;
            formTitle.textContent = 'Edit Product';

            // Load images
            const images = await loadImages(id);
            existingImages = images;
            renderImageList(images);
            newImageFiles = [];
            newImagePreviews.innerHTML = '';
            pImages.value = '';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete product
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product and all its images?')) return;
            const { error } = await supabaseClient.from('smarttech').delete().eq('id', id);
            if (error) {
                alert('Error deleting product: ' + error.message);
                return;
            }
            alert('Product deleted.');
            loadProducts();
        }

        // Reset form
        function resetForm() {
            editId.value = '';
            pName.value = '';
            pDesc.value = '';
            pPrice.value = '0';
            pOldPrice.value = '0';
            pGiftInfo.value = '';
            pCategory.value = 'car-parts';
            pStock.checked = true;
            formTitle.textContent = 'Add New Product';
            existingImages = [];
            renderImageList([]);
            newImageFiles = [];
            newImagePreviews.innerHTML = '';
            pImages.value = '';
        }

        // Expose functions globally
        window.editProduct = editProduct;
        window.deleteProduct = deleteProduct;
        window.resetForm = resetForm;
        window.removeImage = removeImage;
        window.removeNewImage = removeNewImage;

        // Gift toggle for new images (delegated)
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('new-image-gift')) {
                const index = parseInt(e.target.dataset.index);
                if (!isNaN(index) && newImageFiles[index]) {
                    newImageFiles[index].is_gift = e.target.checked;
                }
            }
        });

        // Init
        productForm.addEventListener('submit', saveProduct);
        loadProducts();
    </script>

</body>
</html>
